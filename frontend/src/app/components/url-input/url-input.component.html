<mat-card appearance="outlined" class="url-card">
    <mat-card-content>
        <mat-form-field class="url-form-field">
            <mat-label>Enter URL</mat-label>
            <input matInput placeholder="https://example.com" [(ngModel)]="url">
            
        </mat-form-field>
        <div class="button-row">
            <button matButton="elevated" (click)="onSubmit()">Go!</button>
        </div>
        
    </mat-card-content>
</mat-card>
